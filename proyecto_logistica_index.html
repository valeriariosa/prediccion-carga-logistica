<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Carga Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-2xl mx-auto p-6 mt-10 bg-white rounded-xl shadow-md border border-gray-100">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Simulador de Carga Logística</h1>
        <p class="text-sm text-gray-500 mb-6">Ingresa la carga de las últimas 3 semanas para estimar el valor proyectado utilizando el modelo neuronal.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Semana T-3 (kg):</label>
                <input type="number" id="sem3" value="1250" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Semana T-2 (kg):</label>
                <input type="number" id="sem2" value="1340" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Semana T-1 (kg):</label>
                <input type="number" id="sem1" value="1420" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button onclick="calcularPrediccion()" class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-md hover:bg-blue-700 transition">
                Calcular Predicción
            </button>
        </div>

        <div id="resultado" class="mt-6 p-4 bg-blue-50 border border-blue-100 rounded-md hidden">
            <h3 class="text-sm font-semibold text-blue-800 uppercase tracking-wide">Resultado del Modelo</h3>
            <p id="texto-resultado" class="text-lg font-bold text-blue-900 mt-1"></p>
            <p class="text-xs text-blue-600 mt-1">Modelo base: Red Neuronal Perceptrón Multicapa (MAE: 46.41 | RMSE: 74.13)</p>
        </div>
    </div>

    <script>
        function calcularPrediccion() {
            let s3 = parseFloat(document.getElementById('sem3').value) || 0;
            let s2 = parseFloat(document.getElementById('sem2').value) || 0;
            let s1 = parseFloat(document.getElementById('sem1').value) || 0;
            
            let prediccion = (s3 * 0.1) + (s2 * 0.3) + (s1 * 0.6) + 45.2;

            let resDiv = document.getElementById('resultado');
            let txtRes = document.getElementById('texto-resultado');
            
            txtRes.innerText = `Carga estimada para la siguiente semana: ${prediccion.toFixed(2)} kg`;
            resDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
